name: bats
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bats:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: brew install bash bats-core shellcheck
      - run: git ls-files '*.sh' '*.bash' bin/omamac test/helpers/fake-* | xargs shellcheck
      - run: bats test/
      - name: Flag gate changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          gate='^(\.github/rulesets/main\.json|\.github/workflows/(bats|pr-title|release)\.yml|\.github/scripts/release\.sh|test/(vm\.sh|vm\.exp|fingerprint\.sh|image\.sh))$'
          # On its own line, so a failed diff fails the step.
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          # grep finding no gate file is fine.
          files=$(printf '%s\n' "$changed" | { grep -E "$gate" || true; } | paste -sd ' ' -)
          [ -z "$files" ] || echo "::warning::This PR changes the merge gate: $files"
