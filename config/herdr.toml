# omamac's herdr config.
#
# How the keys are laid out:
#   With no prefix, keys go to the pane, except the Alt chords below.
#   Ctrl g is herdr's prefix.
#   Ctrl g, then p/t/r/m/o (pane/tab/resize/move/session mode), then a key
#       = a popup running omamac-herdr-mode, which reads that last key
#         itself: herdr rejects multi-key sequences like "prefix+p+n".
#   Ctrl g, s (scroll mode)
#       = herdr's copy mode: j/k, PageUp/PageDown and Ctrl b/Ctrl f move,
#         Ctrl u/Ctrl d move half a page, / searches.
#
# Other prefix keys, none of them a mode letter: q detach, w workspace
# picker, [ ] previous/next workspace, 1-9 workspace by number, g goto
# agent, comma settings, e edit scrollback, b sidebar, ? help.
#
# omamac writes the helper's absolute path into the commands below: herdr
# runs custom commands without omamac's PATH.

# herdr writes this line on its first start. Setting it here keeps herdr
# from changing omamac's file.
onboarding = false

[theme]
name = "@OMAMAC_HERDR_THEME@"

[ui]
# One bar, at the bottom.
tab_bar_position = "bottom"
# A new tab opens without asking for a name first.
prompt_new_tab_name = false
# herdr's default dots tell agent states apart by color alone; symbols
# give blocked / working / done / idle each a shape too.
status_indicators = "symbols"

# Under each Claude or Copilot agent the sidebar shows the note set with
# Ctrl g p c (the pane's name, "pane"), then the agent's terminal title:
# for Claude Code its task summary, since herdr's border label only says
# "claude" (show_agent_labels_on_pane_borders). The note is what says what
# an agent is for. herdr hides empty rows, so no note means no blank line.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["pane"], ["terminal_title_stripped"]]
copilot = [["state_icon", "workspace", "tab"], ["pane"], ["terminal_title_stripped"]]

[keys]
prefix = "ctrl+g"

# --- Direct Alt chords, with no prefix -----------------------------------
focus_pane_left = ""
focus_pane_right = ""
focus_pane_down = ["alt+j", "alt+down"]
focus_pane_up = ["alt+k", "alt+up"]
move_tab_previous = "alt+i"
move_tab_next = "alt+o"

# --- herdr's own actions on prefix keys no mode uses ---------------------
detach = "prefix+q"
workspace_picker = "prefix+w"
goto = "prefix+g"
settings = "prefix+comma"
edit_scrollback = "prefix+e"
toggle_sidebar = "prefix+b"
help = "prefix+?"
copy_mode = "prefix+s"
# herdr leaves these unbound. Not prefix+shift+h/l: herdr's own swap_pane
# defaults sit there. Not prefix+shift+1..9: herdr reads the shifted
# character as a US layout, so Shift 2 (' on Turkish Q, " on UK/German)
# does nothing. Plain digits work on every layout; tabs keep Ctrl g t 1-9.
previous_workspace = "prefix+["
next_workspace = "prefix+]"
switch_workspace = "prefix+1..9"

# --- herdr defaults that would shadow a mode letter or teach a second
# --- way to do the same thing: the modes handle all of these.
new_tab = ""
switch_tab = ""
rename_tab = ""
previous_tab = ""
next_tab = ""
close_tab = ""
rename_pane = ""
split_vertical = ""
split_horizontal = ""
close_pane = ""
zoom = ""
resize_mode = ""
cycle_pane_next = ""
cycle_pane_previous = ""
open_notification_target = ""

# --- Direct chords herdr has no action for -------------------------------
[[keys.command]]
key = ["alt+h", "alt+left"]
type = "shell"
command = "@OMAMAC_HELPER@ focus-or-tab left"
description = "focus pane or tab left"

[[keys.command]]
key = ["alt+l", "alt+right"]
type = "shell"
command = "@OMAMAC_HELPER@ focus-or-tab right"
description = "focus pane or tab right"

[[keys.command]]
key = "alt+n"
type = "shell"
command = "@OMAMAC_HELPER@ new-pane"
description = "new pane"

# Only Alt =: herdr 0.9 can't bind Alt + ("+" is its key separator, and
# "alt+plus" passes `herdr config check` but the client disables it).
[[keys.command]]
key = "alt+="
type = "shell"
command = "@OMAMAC_HELPER@ grow"
description = "grow pane"

[[keys.command]]
key = "alt+minus"
type = "shell"
command = "@OMAMAC_HELPER@ shrink"
description = "shrink pane"

# A scratch shell in a popup: exit it to get back.
[[keys.command]]
key = "alt+f"
type = "popup"
command = "exec \"${SHELL:-bash}\""
description = "scratch shell"
width = "80%"
height = "80%"

# --- Ctrl g, then a mode letter ------------------------------------------
[[keys.command]]
key = "prefix+p"
type = "popup"
command = "@OMAMAC_HELPER@ pane"
description = "pane mode"
width = "100%"
height = 5

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "@OMAMAC_HELPER@ tab"
description = "tab mode"
width = "100%"
height = 5

[[keys.command]]
key = "prefix+r"
type = "popup"
command = "@OMAMAC_HELPER@ resize"
description = "resize mode"
width = "100%"
height = 5

[[keys.command]]
key = "prefix+m"
type = "popup"
command = "@OMAMAC_HELPER@ move"
description = "move mode"
width = "100%"
height = 5

[[keys.command]]
key = "prefix+o"
type = "popup"
command = "@OMAMAC_HELPER@ session"
description = "session mode"
width = "100%"
height = 5

[[keys.command]]
key = "prefix+ctrl+q"
type = "popup"
command = "@OMAMAC_HELPER@ quit"
description = "quit"
width = "100%"
height = 5
